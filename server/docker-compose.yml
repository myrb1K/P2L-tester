# Nasazení serveru P2L Testeru v Dockeru: backend + MariaDB.
#
#   cp .env.docker.example .env.docker      # vyplnit JWT_SECRET a DB_PASSWORD
#   docker compose --env-file .env.docker up -d --build
#
# `--env-file` je potřeba u KAŽDÉHO příkazu (up, logs, exec, down) — compose
# z něj bere hodnoty pro ${...} níže. Bez něj se použijí jen defaulty a příkaz
# skončí chybou na chybějícím JWT_SECRET.
#
# Kdo má MariaDB vlastní (firemní server), tenhle compose nepotřebuje — stačí
# image ze Dockerfile a `docker run` s DB_* proměnnými, viz README §Docker.

name: p2l-tester

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    # Databázi zakládá image z MARIADB_DATABASE, a to s default charsetem
    # serveru — proto se utf8mb4 vynucuje tady. Schéma tabulek si server
    # dodělá sám při startu (db/*.mariadb.sql).
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_NAME:-P2Lunits}
      MARIADB_USER: ${DB_USER:-p2l}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD musí být nastavené (viz .env.docker)}
      # Root účet appka nepotřebuje — DB_USER má na svou databázi ALL PRIVILEGES.
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Port 3306 se na host ZÁMĚRNĚ nemapuje — databáze je dostupná jen pro
    # `api` přes interní síť compose. Kdo potřebuje připojit klienta zvenčí,
    # ať přidá `ports: ["127.0.0.1:3306:3306"]` (loopback, ne 0.0.0.0).

  api:
    build:
      context: .
    image: p2l-tester-server:latest
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      P2L_DATA_DIR: /data
      # Musí být stabilní: změna JWT_SECRET zneplatní všechny vydané tokeny
      # (web i nativní klienti se budou muset přihlásit znovu).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET musí být nastavené, min. 32 znaků (viz .env.docker)}
      DB_DRIVER: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-P2Lunits}
      DB_USER: ${DB_USER:-p2l}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD musí být nastavené (viz .env.docker)}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      # POVINNÉ, když web běží na jiné adrese než API (p2lweb.… vs p2lapi.…):
      # bez toho prohlížeč zahodí každou odpověď a appka vypadá rozbitě.
      # Prázdné jen při nasazení, kde web i API sdílí origin.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Počet reverzních proxy před API — určuje, jakou IP vidí rate limit na
      # /api/login. Musí sedět s tím, jak routuje Traefik:
      #   - Traefik jde na `api` přímo (vlastní subdoména / path routing) → 1
      #   - Traefik posílá vše na `web` a /api/ přeposílá nginx → 2
      # Špatná hodnota není kosmetika: nízká sloučí web klienty do jedné IP
      # (jeden uživatel s překlepy zamkne login všem), vysoká jde obejít
      # podvrženou hlavičkou X-Forwarded-For. Viz README §Zapojení do Traefiku.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Použije se jen při prvním startu nad prázdnou tabulkou users; potom se
      # ignoruje. Po prvním přihlášení heslo změnit.
      INITIAL_ADMIN_USER: ${INITIAL_ADMIN_USER:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    ports:
      # Default jen loopback — pro přístup ze sítě (EXE/APK klienti) přepiš
      # API_BIND na 0.0.0.0 a port si ochraň firewallem / reverzní proxy.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-3001}:3001"
    volumes:
      # Při DB_DRIVER=mariadb je tu jen server.pid; volume se drží proto, aby
      # přepnutí na sqlite nebo přiložení dalších dat nic nepřepsalo.
      - api-data:/data

  # Webová varianta appky: nginx se statikou z `flutter build web`, který
  # všechno pod /api/ přeposílá na `api` výše (viz docker/nginx-web.conf).
  # Web a API tak mají stejný origin → session cookie funguje a CORS_ORIGIN
  # zůstává prázdné.
  #
  # Routing před kontejnery dělá Traefik. Cílový stav: vlastní subdomény
  # (`p2lweb.…` sem, `p2lapi.…` na `api`) → appka musí být sestavená s
  # absolutní adresou API a `api` musí mít vyplněné CORS_ORIGIN.
  # Config nginxu je stejný pro všechny varianty routingu; blok `location /api/`
  # se použije jen tehdy, když web a API sdílí adresu.
  # Viz README §Dvě topologie a §Zapojení do Traefiku.
  web:
    build:
      # Kontext je root repa (Flutter zdroje), ne server/.
      context: ..
      dockerfile: Dockerfile.web
    image: ${WEB_IMAGE:-p2l-tester-web:latest}
    restart: unless-stopped
    # Jen pořadí startu. Na dostupnosti API nginx nezávisí — jméno `api` si
    # přeloží až za běhu (resolver v configu), takže přežije i restart backendu.
    depends_on:
      - api
    ports:
      # Default loopback: navenek to vystavuje reverzní proxy s TLS. Pro přímý
      # přístup z LAN (bez proxy) přepiš WEB_BIND na 0.0.0.0 — ale pak jde
      # session cookie po HTTP, viz README.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"

volumes:
  db-data:
  api-data:
