org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Vypnutá Kotlin inkrementální kompilace — projekt (D:) a pub cache (C:) jsou na
# různých discích, Kotlin incremental compiler pak padá v RelocatableFileToPathConverter
# ("different roots") při zápisu cache pro pluginy (package_info_plus, share_plus).
kotlin.incremental=false
