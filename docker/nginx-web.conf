# nginx pro webovou variantu P2L Testeru (viz Dockerfile.web).
#
# Servíruje Flutter web build a všechno pod /api/ přeposílá na kontejner s
# backendem. Díky tomu má web i API **stejný origin** → session cookie
# (httpOnly, secure, sameSite=lax) prostě funguje a CORS_ORIGIN na serveru
# zůstává prázdné.
#
# TLS, HTTP/2 a veřejnou doménu řeší reverzní proxy PŘED tímhle kontejnerem
# (na produkci ta, která dnes posílá p2ltester.smartbox.smartci4.com na API) —
# tady jde jen plain HTTP na portu 80.
#
#   Browser ──HTTPS──> reverzní proxy ──HTTP──> tenhle nginx ──┬── /       statika
#                                                             └── /api/*  api:3001

# Docker embedded DNS. Bez resolveru + proměnné v proxy_pass by si nginx přeložil
# jméno `api` jednou při startu: nenaběhl by, dokud neběží API, a po restartu
# API by držel starou IP a vracel 502.
resolver 127.0.0.11 ipv6=off valid=10s;

# Původní schéma od vnější proxy. Express má `trust proxy`, ale hlavičku mu musí
# někdo předat — bez ní by za dvěma hopy neviděl ani protokol, ani IP klienta
# (rate limit na /api/login by pak počítal všechny web klienty jako jednoho).
map $http_x_forwarded_proto $p2l_fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;

  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Statika je malá a chodí přes proxy, komprese se vyplatí. Na .wasm
  # (CanvasKit, ~6 MB) má největší efekt.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  # `text/javascript` (ne jen `application/javascript`) je nutné: nginx od 1.21
  # mapuje .js na text/javascript, takže by se `main.dart.js` (~3,4 MB) jinak
  # poslal nezabalený.
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/wasm application/manifest+json
             image/svg+xml;

  # ── Bezpečnostní hlavičky ────────────────────────────────────────────────
  #
  # `unsafe-inline`/`unsafe-eval` v script-src Flutter web v běžném buildu
  # potřebuje (dart2js generuje kód za běhu); `wasm-unsafe-eval` je pro
  # CanvasKit. Zpřísnit by šlo buildem s `--csp`, který eval z výstupu vyhodí —
  # neověřeno, proto to teď nezavádíme.
  #
  # connect-src musí povolit `wss:` obecně: broker si uživatel zadává v profilu,
  # takže cílový host není dopředu známý. Pozn.: broker na nezabezpečeném `ws://`
  # z HTTPS stránky nepojede ani s povolující CSP — mixed content blokuje
  # prohlížeč sám, broker musí mít WSS.
  #
  # `__API_ORIGIN__` nahradí build (Dockerfile.web) originem odvozeným
  # z AUTH_API_BASE. Když API běží na vlastní doméně (`https://p2lapi.…`),
  # bez tohohle by CSP zabila **každé** volání backendu; při same-origin
  # nasazení se placeholder smaže a stačí `'self'`.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss: __API_ORIGIN__; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  # Flutter web nemá v názvech souborů hash (`main.dart.js` se jmenuje stejně
  # v každé verzi), takže dlouhá cache by po nasazení servírovala starou appku,
  # případně starý CanvasKit k novému main.dart.js. `no-cache` neznamená
  # „nestahuj do cache", ale „vždy revalidovat" — nezměněné soubory tedy dál
  # končí jako 304 bez těla.
  add_header Cache-Control "no-cache" always;

  # ── API pod stejnou adresou jako web ─────────────────────────────────────
  # Používá se jen v same-origin nasazení. Když má API vlastní doménu
  # (`p2lapi.…`) a Traefik ji routuje rovnou na backend, tenhle blok leží ladem
  # — appka na něj vůbec nesáhne, protože má v buildu absolutní URL.
  location /api/ {
    # Proměnná (ne literál) záměrně — viz `resolver` výše.
    set $p2l_api "http://api:3001";
    proxy_pass $p2l_api$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $p2l_fwd_proto;
    proxy_set_header X-Forwarded-Host  $host;

    # `POST /api/units/import` nese celý snímek evidence — nginx default 1 MB
    # by ho odřízl dřív, než k němu Express řekne své.
    client_max_body_size 16m;

    # Vlastní sada hlaviček: `add_header` v location ruší dědění ze `server`
    # bloku, takže CSP pro statiku se do JSON odpovědí neplete a API dostane
    # `no-store` místo `no-cache`.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # ── Health check kontejneru ──────────────────────────────────────────────
  # Obsluhuje nginx sám, takže „web je nahoře" nezávisí na dostupnosti API.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # ── Statika + SPA fallback ───────────────────────────────────────────────
  # Flutter web běží na jedné stránce; neznámou cestu vrátíme jako index.html,
  # aby reload na hlubší URL nebo návrat z historie neskončil 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
