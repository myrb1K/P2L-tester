# Mosquitto config pro lokální vývoj P2L Tester Web (branch WEB)
#
# Spuštění z root projektu:
#   & "C:\Program Files\mosquitto\mosquitto.exe" -c .dev\mosquitto.conf -v
#
# Listenery:
#   - 1883: plain TCP MQTT (pro Windows/Android verzi appky paralelně)
#   - 9001: plain WebSockets (pro Flutter Web build)
#
# Anonymní přístup povolen — jen pro lokální dev, NEPOUŽÍVAT v produkci.

# === TCP MQTT listener ===
listener 1883 0.0.0.0
protocol mqtt

# === WebSocket listener ===
listener 9001 0.0.0.0
protocol websockets

# === Společná nastavení ===
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
